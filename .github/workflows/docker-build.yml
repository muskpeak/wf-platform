name: Build and Push Monorepo Web Image

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to GHCR"
        required: true
        default: true
        type: boolean
      image_tag:
        description: "Docker image tag"
        required: true
        default: "latest"
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' || inputs.push_image }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/wf-platform-web:${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || (github.ref_name == 'main' && 'latest' || github.ref_name) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
